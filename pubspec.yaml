name: mobile
description: Mother Care School mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.4
  socket_io_client: ^3.1.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  record: ^6.1.1
  path_provider: ^2.1.5
  path: ^1.9.1
  video_player: ^2.9.2
  just_audio: ^0.10.6
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  cryptography: ^2.9.0
  flutter_native_splash: ^2.4.6
  sqflite: ^2.4.2
  file_picker: ^10.1.2
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#F8F7FF"
  adaptive_icon_foreground: assets/logo.png
  web:
    generate: true
    image_path: assets/logo.png
  windows:
    generate: true
    image_path: assets/logo.png
  macos:
    generate: true
    image_path: assets/logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_logo.png
  android_gravity: center
  ios_content_mode: scaleAspectFit
  android_12:
    color: "#FFFFFF"
    image: assets/splash_logo.png
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/bgless_logo.png
    - assets/splash_logo.png
